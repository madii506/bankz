</section>

<script src="/assets/js/config.js?v=b1"></script>

      for (const d of D) {
        d.y -= d.v * dt; d.x += Math.sin(t * 0.6 + d.sway) * 6 * dt; if (d.y < -10) Object.assign(d, mk(false));
        const tw = 0.5 + 0.5 * Math.sin(t * d.w * 2 + d.ph), fade = Math.min(1, d.y / (H * 0.25)) * Math.min(1, (H - d.y) / 60 + 0.2);
        star(d.x, d.y, d.s * (0.6 + tw * 0.6), Math.max(0, (0.18 + tw * 0.62) * fade), d.gold ? '#ffd970' : '#fff8e6');
      }
      g.globalAlpha = 1;
    }
    size(); addEventListener('resize', size);
    const vis = () => { cancelAnimationFrame(raf); raf = 0; if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } };
    document.addEventListener('visibilitychange', vis); vis();
  }

  // searchlights: two beams sweeping the sky behind the towers, crossing now and then
  function beams() {
    const c = $('#beams'); if (!c || !c.getContext) return; const g = c.getContext('2d');
    let W = 0, H = 0, raf = 0, last = 0;
    const B = [{ x: 0.22, a: -0.32, amp: 0.38, sp: 0.21, ph: 0.4, w: 0.055 }, { x: 0.79, a: 0.3, amp: 0.36, sp: 0.17, ph: 2.1, w: 0.05 }, { x: 0.52, a: 0.05, amp: 0.5, sp: 0.12, ph: 4.2, w: 0.04 }];
    function size() { const r = Math.min(devicePixelRatio || 1, 1.5); W = c.clientWidth; H = c.clientHeight; c.width = Math.round(W * r); c.height = Math.round(H * r); g.setTransform(r, 0, 0, r, 0, 0); }
    function frame(now) {
      raf = requestAnimationFrame(frame); if (now - last < 32) return; last = now; const t = now / 1000;
      g.clearRect(0, 0, W, H); const L = Math.hypot(W, H) * 1.05, oy = H * 0.6;
      for (const b of B) {
        if (W < 600 && b.x === 0.52) continue;
        const ang = b.a + Math.sin(t * b.sp + b.ph) * b.amp, ox = W * b.x, dx = Math.sin(ang), dy = -Math.cos(ang), px = -dy, py = dx, half = L * b.w;
        const ex = ox + dx * L, ey = oy + dy * L;
        const gr = g.createLinearGradient(ox, oy, ex, ey); gr.addColorStop(0, 'rgba(255,238,190,.22)'); gr.addColorStop(0.45, 'rgba(255,226,150,.08)'); gr.addColorStop(1, 'rgba(255,226,150,0)');
        g.fillStyle = gr; g.beginPath(); g.moveTo(ox - px * 3, oy - py * 3); g.lineTo(ox + px * 3, oy + py * 3); g.lineTo(ex + px * half, ey + py * half); g.lineTo(ex - px * half, ey - py * half); g.closePath(); g.fill();
      }
    }
    size(); addEventListener('resize', size);
    const vis = () => { cancelAnimationFrame(raf); raf = 0; if (!document.hidden) { last = 0; raf = requestAnimationFrame(frame); } };
    document.addEventListener('visibilitychange', vis); vis();
  }

  // live from the vault: real boxes rise out of the city one at a time as deposit slips (nothing shows until there are boxes)
  async function tags() {
    let boxes = [];
    try { const r = await fetch('/api/m?a=boxes', { cache: 'no-store' }); const j = await r.json(); boxes = (j.boxes || []).filter(b => b.state === 'locked'); } catch { return; }
    if (!boxes.length) return;
    const amt = x => x >= 1e9 ? (x / 1e9).toFixed(1) + 'B' : x >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : x >= 1 ? x.toFixed(1) : x.toPrecision(2);
    const left = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? `${d}d` : `${h}h`; };
    const box = $('#tags'); let k = 0;
    // a spot clear of the title, the line and the buttons, for a slip of this size (it drifts up ~40px as it fades)
    const spot = (w, h) => { const W = innerWidth, H = innerHeight, R = ['#wm', '.feat', '.cta'].map(s => $(s).getBoundingClientRect()), L = Math.min(...R.map(r => r.left)) - 18, Rt = Math.max(...R.map(r => r.right)) + 18, T = R[0].top - 24, Bt = R[2].bottom + 24;
      for (let i = 0; i < 40; i++) { const x = Math.max(w / 2 + 10, Math.min(W - w / 2 - 10, 90 + Math.random() * (W - 180))), y = H * (0.3 + Math.random() * 0.5); if (x + w / 2 > L && x - w / 2 < Rt && y + h + 18 > T && y - 40 < Bt) continue; return [x, y]; } return null; };
    const show = () => {
      if (document.hidden || box.childElementCount >= 2) return;
      const b = boxes[k++ % boxes.length], el = document.createElement('div'); el.className = 'tag'; el.style.visibility = 'hidden';
      el.innerHTML = `<div class="tg"><span class="t1">${b.icon ? `<img src="${esc(b.icon)}" alt="" onerror="this.remove()">` : ''}BOX No. ${String(b.n).padStart(4, '0')}</span><span class="t2">${esc(amt(b.amount))} ${esc(b.sym)}</span><span class="t3">opens in <b>${left(b.unlock - Date.now() / 1000)}</b></span></div>`;
      el.style.setProperty('--r', ((Math.random() - 0.5) * 7).toFixed(1) + 'deg');
      box.appendChild(el); const p = spot(el.offsetWidth + 22, el.offsetHeight); if (!p) { el.remove(); return; }
      el.style.left = p[0].toFixed(0) + 'px'; el.style.top = p[1].toFixed(0) + 'px'; el.style.visibility = ''; setTimeout(() => el.remove(), 4700);
    };
    setTimeout(function loop() { show(); setTimeout(loop, 2400 + Math.random() * 1800); }, 1500);
  }

  // ---------------------------------------------------------------- the entrance: the name flips in, the line flaps, the boxes start to rise
  let entered = false;
  function enter() {
    if (entered) return; entered = true;
    document.documentElement.classList.add('entered');
    if (still) return;
    wmIn(); wordsIn(); tags();
  }
  enter();

  if (!still) {
    dust(); beams();
    if (fine) {
      // the title floats a touch against the pointer
      let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      const st = () => { x += (tx - x) * 0.12; y += (ty - y) * 0.12; stack.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`; raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.05 ? requestAnimationFrame(st) : 0; };
      addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - 0.5) * -12; ty = (e.clientY / innerHeight - 0.5) * -7; if (!raf) raf = requestAnimationFrame(st); }, { passive: true });
    }
  }
})();
</script>
</body>
