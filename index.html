    function size() { const r = Math.min(devicePixelRatio || 1, 1.5); W = c.clientWidth; H = c.clientHeight; c.width = Math.round(W * r); c.height = Math.round(H * r); g.setTransform(r, 0, 0, r, 0, 0); }

  // ---------------------------------------------------------------- the vault door: hold to open it, or wait and it opens itself

    v.addEventListener('pointerdown', e => { e.preventDefault(); down(e); });
    v.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('blur', up);
    addEventListener('keydown', down); addEventListener('keyup', up);
    raf = requestAnimationFrame(frame);
    setTimeout(open, 6000);   // a backstop: the door never keeps anyone out
    door.shut = () => { B.forEach(b => b.classList.remove('off')); vw.style.transition = ''; };
  }
  door();

  if (!still) {
    dust(); beams();
    if (fine) {
      // the title floats a touch against the pointer
      let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      const st = () => { x += (tx - x) * 0.12; y += (ty - y) * 0.12; stack.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`; raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.05 ? requestAnimationFrame(st) : 0; };
      addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - 0.5) * -12; ty = (e.clientY / innerHeight - 0.5) * -7; if (!raf) raf = requestAnimationFrame(st); }, { passive: true });
    }
    // leaving: the vault door swings shut, then the terminal opens
    $$('.cta .btn').forEach(a => a.addEventListener('click', e => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); const v = $('#vdoor'); if (!v) { location.href = a.href; return; } door.shut && door.shut(); v.classList.add('shut'); try { sessionStorage.setItem('bankz.via', 'door'); } catch (e2) { } setTimeout(() => { location.href = a.href; }, 620);
    }));
    addEventListener('pageshow', e => { if (e.persisted) $('#vdoor').classList.remove('shut'); });
  }
})();
</script>
